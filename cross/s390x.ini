[binaries]
c = 's390x-linux-gnu-gcc'
cpp = 's390x-linux-gnu-g++'
ar = 's390x-linux-gnu-ar'
strip = 's390x-linux-gnu-strip'
exe_wrapper = ['env', 'QEMU_LD_PREFIX=/usr/s390x-linux-gnu', 'qemu-s390x-static']

[properties]
pkg_config_libdir = ['/usr/lib/s390x-linux-gnu/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 's390x'
cpu = 's390x'
endian = 'big'
