name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  meson:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Versions agree with the tag
        run: bash scripts/check-versions.sh
      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Changelog section for this tag
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" -o "${RUNNER_TEMP}/notes.md"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      - name: Install capnproto, xz, and autotools
        run: sudo apt-get update && sudo apt-get install -y capnproto xz-utils autoconf automake libtool pkg-config g++ make
      - name: Configure
        run: meson setup build -Dbuildtype=release -Denable_tests=true -Dfuzz=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      # A skipped CapnpCli fixture still reports the suite as passing, so
      # assert the upstream-CLI parity tests actually executed.
      - name: capnp CLI parity tests ran rather than skipped
        run: |
          ./build/capnp-cli-interop-test > cli-interop.log 2>&1
          if grep -q 'SKIPPED' cli-interop.log; then
            echo "CapnpCli tests skipped; capnp CLI was missing at configure time" >&2
            grep 'SKIPPED' cli-interop.log >&2
            exit 1
          fi
          grep -E '^\[  PASSED  \]' cli-interop.log
      # The level 3 frames are evidence of parity only while they are
      # still what the CLI emits from the schema.
      - name: level 3 frames still match the capnp CLI
        run: bash scripts/gen-rpc-frames.sh --check
      - name: Fuzz smoke
        run: |
          # One-shot corpus replay, not unbounded AFL/libFuzzer.
          mkdir -p fuzz/in
          if [ ! -s fuzz/in/Person.bin ]; then
            if ! command -v capnp >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y capnproto
            fi
            capnp encode -Icompiler tests/addressbook.capnp Person < fuzz/Person.txt > fuzz/in/Person.bin
          fi
          test -s fuzz/in/Person.bin
          test -x build/fuzz-mem
          test -x build/fuzz-fp
          ./build/fuzz-mem fuzz/in/Person.bin
          ./build/fuzz-fp fuzz/in/Person.bin
      - name: Install smoke
        run: |
          DESTDIR=$PWD/destdir meson install -C build
          test -x destdir/usr/local/bin/capnpc-c
          test -f destdir/usr/local/include/capnp_c.h
          test -f destdir/usr/local/include/c.capnp.h
          test -f destdir/usr/local/share/c-capnproto/c.capnp
          test -f destdir/usr/local/lib/pkgconfig/c-capnproto.pc \
            || test -f destdir/usr/local/lib/*/pkgconfig/c-capnproto.pc \
            || { find destdir/usr/local/lib -print | head -40; exit 1; }
      - name: Source tarball
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          meson dist -C build --no-tests
          if [ "$PRERELEASE" = "true" ]; then
            ver=$(tr -d '[:space:]' < VERSION.txt)
            tagver="${GITHUB_REF_NAME#v}"
            stage=$(mktemp -d)
            for f in build/meson-dist/c-capnproto-"$ver".tar.xz build/meson-dist/c-capnproto-"$ver".tar.gz; do
              if [ ! -f "$f" ]; then
                continue
              fi
              case "$f" in
                *.tar.xz) flag=J; ext=.tar.xz ;;
                *.tar.gz) flag=z; ext=.tar.gz ;;
              esac
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xf "$f" -C "$stage"
              test -d "$stage/c-capnproto-$ver"
              mv "$stage/c-capnproto-$ver" "$stage/c-capnproto-$tagver"
              dest="build/meson-dist/c-capnproto-${tagver}${ext}"
              tar -C "$stage" -c"$flag" -f "$dest" "c-capnproto-$tagver"
              rm -f "$f" "$f.sha256sum"
              (
                cd build/meson-dist
                sha256sum "$(basename "$dest")" > "$(basename "$dest").sha256sum"
              )
            done
            rm -rf "$stage"
          fi
          tarball=$(find build/meson-dist -type f \( -name 'c-capnproto-*.tar.xz' -o -name 'c-capnproto-*.tar.gz' \) -print -quit)
          test -n "$tarball"
          name=$(basename "$tarball")
          name=${name%.tar.xz}
          name=${name%.tar.gz}
          root=$(tar -tf "$tarball" | awk -F/ 'NR==1 { print $1; exit }')
          test "$root" = "$name"
          wc -c "$tarball"
          tar -tf "$tarball" | grep -F 'gtest/googletest/include/gtest/gtest.h'
      - name: Autotools from the dist tarball
        run: |
          tarball=$(find build/meson-dist -type f \( -name 'c-capnproto-*.tar.xz' -o -name 'c-capnproto-*.tar.gz' \) -print -quit)
          src="${RUNNER_TEMP}/dist-src"
          rm -rf "$src"
          mkdir -p "$src"
          tar -xf "$tarball" -C "$src" --strip-components=1
          test -d "$src/gtest/googletest"
          (
            cd "$src"
            autoreconf -fi
            ./configure
            make -j"$(nproc)"
            make -j"$(nproc)" check
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: build/meson-dist/c-capnproto-*.tar.*
          if-no-files-found: error

  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Versions agree with the tag
        run: bash scripts/check-versions.sh
      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config g++ make capnproto
      - name: Configure
        run: |
          autoreconf -fi
          ./configure
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make -j"$(nproc)" check

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Versions agree with the tag
        run: bash scripts/check-versions.sh
      - name: Install CMake and GTest
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libgtest-dev capnproto
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -N | grep -E 'Test #.*capn-test'

  sanitizers:
    name: ASan+UBSan (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto clang
          rt="libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          sudo apt-get install -y "$rt"
      - name: Configure
        run: meson setup build -Dbuildtype=debugoptimized -Db_sanitize=address,undefined -Db_lundef=false -Denable_tests=true
      - name: Unit tests are registered
        run: test "$(meson test -C build --list | wc -l)" -ge 17
      - name: Build
        run: meson compile -C build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0,detect_odr_violation=0,allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: meson test -C build --print-errorlogs

  packaging:
    name: downstream consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      - name: CMake, find_package, pkg-config and meson subproject
        run: bash scripts/packaging-smoke.sh

  rpc-interop:
    name: live capnp-C++ RPC peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      # libcapnp-dev brings the C++ RPC library the peer server links.
      - name: Install capnproto and libcapnp-rpc
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      - name: Configure
        run: meson setup build -Denable_tests=true
      - name: Build
        run: meson compile -C build
      - name: The interop test ran rather than being skipped
        run: |
          meson test -C build rpc_interop_cpp --print-errorlogs
          test -x build/rpc_peer_server

  github-release:
    needs: [meson, autotools, cmake, sanitizers, packaging, rpc-interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ needs.meson.outputs.prerelease }}
        run: |
          shopt -s nullglob
          tarballs=(dist/*)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "meson dist produced no tarball" >&2
            exit 1
          fi
          if [ "$PRE" = "true" ]; then
            pre_args=(--prerelease)
          else
            pre_args=(--prerelease=false)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes/notes.md "${pre_args[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${tarballs[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes/notes.md "${pre_args[@]}" "${tarballs[@]}"
          fi
