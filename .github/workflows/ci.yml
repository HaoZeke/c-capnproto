name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    name: version files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: VERSION.txt, meson.build, and configure.ac agree
        run: bash scripts/check-versions.sh

  meson:
    name: meson (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            meson_opts: -Denable_tests=enabled -Dfuzz=true
            run_tests: true
            fuzz_smoke: true
          - os: macos-latest
            meson_opts: -Denable_tests=enabled
            run_tests: true
            fuzz_smoke: false
          # x64 only. No win32 matrix (no validated ILP32 Windows
          # toolchain). 32-bit: compile-time check_segment_alignment;
          # optional sh scripts/smoke-m32.sh when gcc -m32 exists.
          # See MAINTAINING.md (32-bit / alignment).
          - os: windows-latest
            meson_opts: --vsenv -Denable_tests=disabled
            run_tests: false
            fuzz_smoke: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      # capnp must be on PATH before `meson setup`: find_program bakes the
      # path into CAPNP_CLI, and the 19 CapnpCli tests GTEST_SKIP without it.
      # `-> stream` imports /capnp/stream.capnp, which ships in libcapnp-dev
      # (and is vendored under compiler/capnp for the same layout).
      - name: Install capnproto
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - name: Configure
        run: meson setup build -Dbuildtype=release ${{ matrix.meson_opts }}
      - name: Build
        run: meson compile -C build
      - name: Test
        if: matrix.run_tests
        run: meson test -C build --print-errorlogs
      # A skipped CapnpCli fixture still reports the suite as passing, so
      # assert the upstream-CLI parity tests actually executed.
      - name: capnp CLI parity tests ran rather than skipped
        if: matrix.run_tests
        run: |
          ./build/capnp-cli-interop-test > cli-interop.log 2>&1
          if grep -q 'SKIPPED' cli-interop.log; then
            echo "CapnpCli tests skipped; capnp CLI was missing at configure time" >&2
            grep 'SKIPPED' cli-interop.log >&2
            exit 1
          fi
          grep -E '^\[  PASSED  \]' cli-interop.log
      # The level 3 frames are evidence of parity only while they are
      # still what the CLI emits from the schema.
      - name: level 3 frames still match the capnp CLI
        if: matrix.run_tests
        run: bash scripts/gen-rpc-frames.sh --check
      # The generated sources are checked in, so they have to be what the
      # current plugin emits.
      - name: Checked-in generated sources are current
        if: runner.os == 'Linux'
        run: bash scripts/regen-generated.sh --check build/capnpc-c
      - name: Fuzz harness smoke
        if: matrix.fuzz_smoke
        run: |
          # One-shot corpus replay, not unbounded AFL/libFuzzer.
          mkdir -p fuzz/in
          if [ ! -s fuzz/in/Person.bin ]; then
            if ! command -v capnp >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y capnproto
            fi
            capnp encode -Icompiler tests/addressbook.capnp Person < fuzz/Person.txt > fuzz/in/Person.bin
          fi
          test -s fuzz/in/Person.bin
          test -x build/fuzz-mem
          test -x build/fuzz-fp
          ./build/fuzz-mem fuzz/in/Person.bin
          ./build/fuzz-fp fuzz/in/Person.bin
      - name: Skip tests (MSVC gtest)
        if: ${{ !matrix.run_tests }}
        run: echo "Windows job builds libcapnp_c and capnpc-c only; gtest subproject is not built (-Denable_tests=disabled)."
      - name: Install smoke
        if: runner.os != 'Windows'
        run: |
          DESTDIR=$PWD/destdir meson install -C build
          test -x destdir/usr/local/bin/capnpc-c
          test -f destdir/usr/local/include/capnp_c.h
          test -f destdir/usr/local/include/c.capnp.h
          test -f destdir/usr/local/share/c-capnproto/c.capnp
          test -f destdir/usr/local/lib/pkgconfig/c-capnproto.pc \
            || test -f destdir/usr/local/lib/*/pkgconfig/c-capnproto.pc \
            || { find destdir/usr/local/lib -print | head -40; exit 1; }
      - name: Install smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          meson install -C build --destdir "$PWD/destdir"
          find destdir -name 'capnpc-c.exe' | grep .
          find destdir -name 'capnp_c.h' | grep .
          find destdir -name 'c.capnp.h' | grep .
          find destdir -name 'c.capnp' | grep .

  sanitizers:
    name: ASan+UBSan (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      # Same stream schema import as the meson job. The matrix compiler
      # is installed here so clang is present on that leg.
      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev clang
          rt="libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          sudo apt-get install -y "$rt"
      - name: Configure
        run: meson setup build -Dbuildtype=debugoptimized -Db_sanitize=address,undefined -Db_lundef=false -Denable_tests=enabled
      - name: Unit tests are registered
        run: test "$(meson test -C build --list | wc -l)" -ge 17
      - name: Build
        run: meson compile -C build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0,detect_odr_violation=0,allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: meson test -C build --print-errorlogs

  packaging:
    name: downstream consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      # Install rules that nothing exercises are how a broken Config.cmake
      # or a stale .pc reaches users. This builds a consumer four ways.
      - name: CMake, find_package, pkg-config and meson subproject
        run: bash scripts/packaging-smoke.sh

  rpc-interop:
    name: live capnp-C++ RPC peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      # libcapnp-rpc-dev brings the C++ RPC library the peer server links.
      - name: Install capnproto and libcapnp-rpc
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      # Byte equality against our own encoders says nothing about whether
      # the reference implementation will talk to us. This bootstraps a
      # real EzRpcServer and calls it.
      - name: Configure
        run: meson setup build -Denable_tests=enabled
      - name: Build
        run: meson compile -C build
      - name: The interop test ran rather than being skipped
        run: |
          meson test -C build rpc_interop_cpp --print-errorlogs
          test -x build/rpc_peer_server

  autotools:
    name: autotools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config g++ make capnproto
      - name: Configure
        run: |
          autoreconf -fi
          ./configure
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make -j"$(nproc)" check

  cmake:
    name: cmake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install CMake and GTest
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libgtest-dev capnproto
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -N | grep -E 'Test #.*capn-test'

  s390x:
    name: qemu s390x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install meson ninja
        run: pip install meson ninja
      - name: Install the s390x cross compiler and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu \
            libc6-dev-s390x-cross qemu-user
      # No host capnp: the CLI parity tests are not built. The runtime
      # suite runs under qemu-s390x from qemu-user. ubuntu-latest does
      # not ship qemu-user-static.
      - name: Configure
        run: meson setup build-s390x --cross-file cross/s390x.ini -Denable_tests=true
      - name: Build
        run: meson compile -C build-s390x
      - name: Test
        run: meson test -C build-s390x --print-errorlogs
