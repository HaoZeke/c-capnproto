name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Ensure PyYAML is available
        run: python3 -c "import yaml" 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - name: Sync repository labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/sync-labels.sh
