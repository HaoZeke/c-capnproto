name: Release prepare (dry-run)

on:
  pull_request:
    paths:
      - cog.toml
      - VERSION.txt
      - scripts/release_notes.py
      - CHANGELOG.md
      - .github/workflows/release*.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Config parses
        run: python3 -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('cog.toml').read_text(encoding='utf-8'))"
      - name: Changelog section extracts cleanly
        run: python3 scripts/release_notes.py "$(tr -d '[:space:]' < VERSION.txt)" > /dev/null
